<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Asteroids</title><style>body{margin:0;background:#111;color:#fff;font:18px sans-serif;text-align:center}canvas{background:#000;margin-top:10px;max-width:100%}</style>
<div>Šipky: točení/tah, mezerník: střelba, Enter: znovu</div><canvas id=c width=700 height=500></canvas>
<script>
const x=c.getContext('2d'),W=700,H=500;let s,bl,rk,score,lives,k={},cd;
const ns=()=>({x:W/2,y:H/2,a:-Math.PI/2,vx:0,vy:0,inv:120});
function init(){s=ns();bl=[];rk=[];score=0;lives=3;cd=0;for(let i=0;i<5;i++)mk(40)}
function mk(r,px,py){const a=Math.random()*6.28,sp=1+Math.random()*1.5;let X=px,Y=py;if(X===undefined){do{X=Math.random()*W;Y=Math.random()*H}while(Math.hypot(X-s.x,Y-s.y)<150)}rk.push({x:X,y:Y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r})}
onkeydown=e=>{k[e.code]=1;if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(e.code=='Enter'&&lives<=0)init()};onkeyup=e=>k[e.code]=0;
const wrap=o=>{o.x=(o.x+W)%W;o.y=(o.y+H)%H};
function upd(){if(lives<=0)return;if(k.ArrowLeft)s.a-=.07;if(k.ArrowRight)s.a+=.07;
 if(k.ArrowUp){s.vx+=Math.cos(s.a)*.12;s.vy+=Math.sin(s.a)*.12}
 s.vx*=.99;s.vy*=.99;s.x+=s.vx;s.y+=s.vy;wrap(s);if(s.inv>0)s.inv--;
 if(k.Space&&cd<=0){bl.push({x:s.x,y:s.y,vx:Math.cos(s.a)*7+s.vx,vy:Math.sin(s.a)*7+s.vy,t:60});cd=12}cd--;
 bl.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.t--;wrap(b)});bl=bl.filter(b=>b.t>0);rk.forEach(r=>{r.x+=r.vx;r.y+=r.vy;wrap(r)});
 for(const b of bl)for(const r of rk)if(!b.d&&!r.d&&Math.hypot(b.x-r.x,b.y-r.y)<r.r){b.d=r.d=1;score+=r.r>25?20:r.r>15?50:100;if(r.r>15){mk(r.r/2,r.x,r.y);mk(r.r/2,r.x,r.y)}}
 rk=rk.filter(r=>!r.d);bl=bl.filter(b=>!b.d);if(!rk.length)for(let i=0;i<6;i++)mk(40);
 if(s.inv<=0&&rk.some(r=>Math.hypot(s.x-r.x,s.y-r.y)<r.r+8)){lives--;s=ns()}}
(function loop(){upd();x.fillStyle='#000';x.fillRect(0,0,W,H);x.strokeStyle='#fff';
 if(lives>0&&(s.inv%10<5)){x.beginPath();x.moveTo(s.x+Math.cos(s.a)*14,s.y+Math.sin(s.a)*14);x.lineTo(s.x+Math.cos(s.a+2.5)*12,s.y+Math.sin(s.a+2.5)*12);x.lineTo(s.x+Math.cos(s.a-2.5)*12,s.y+Math.sin(s.a-2.5)*12);x.closePath();x.stroke()}
 rk.forEach(r=>{x.beginPath();x.arc(r.x,r.y,r.r,0,6.3);x.stroke()});bl.forEach(b=>x.fillRect(b.x-1,b.y-1,3,3));
 x.fillStyle='#fff';x.font='18px sans-serif';x.fillText('Skóre '+score+'  Životy '+lives,10,24);if(lives<=0)x.fillText('Konec! Enter = znovu',270,250);requestAnimationFrame(loop)})();
init();
</script>
